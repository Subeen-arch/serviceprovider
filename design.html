document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tter-spacing:-.03em;margin:0 0 12px;line-height:1.05\">From “my socket is dead” to a booked electrician in four answers.<\u002Fh1>\n<p style=\"font-size:17px;color:var(--ink-2);line-height:1.6;margin:0 0 46px;max-width:40em\">Nothing is hidden behind a black box. Here is exactly what happens at each step and what the platform does with your answer.<\u002Fp>\n<sc-for list=\"{{ howSteps }}\" as=\"h\" hint-placeholder-count=\"6\">\n<div style=\"display:grid;grid-template-columns:92px minmax(0,1fr);gap:32px;padding:32px 0;border-top:1px solid var(--line)\">\n<div class=\"mn\" style=\"font-size:13px;color:var(--green);padding-top:5px\">{{ h.n }}<\u002Fdiv>\n<div>\n<h2 style=\"font-size:24px;letter-spacing:-.02em;margin:0 0 10px\">{{ h.title }}<\u002Fh2>\n<p style=\"font-size:15px;line-height:1.65;color:var(--ink-2);margin:0 0 14px;max-width:42em\">{{ h.body }}<\u002Fp>\n<div style=\"display:inline-block;font-size:12.5px;background:var(--sunk);padding:8px 12px;color:var(--ink-2)\"><span style=\"font-weight:600\">Behind the scenes:<\u002Fspan> {{ h.tech }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"border-top:1px solid var(--line);padding-top:34px;margin-top:8px\"><button type=\"button\" sc-camel-on-click=\"{{ nav.w1 }}\" class=\"pri\" style=\"min-height:54px;font-size:16px\">Start now<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ p.forproviders }}\">\n<section style=\"max-width:1100px;margin:0 auto;padding:56px 56px 88px\">\n<div class=\"eyebrow\" style=\"margin-bottom:14px\">For providers<\u002Fdiv>\n<h1 style=\"font-size:46px;letter-spacing:-.03em;margin:0 0 14px;line-height:1.05\">Your shop, on the map, in front of the people nearest to it.<\u002Fh1>\n<p style=\"font-size:17px;color:var(--ink-2);line-height:1.6;margin:0 0 40px;max-width:42em\">Listing is free. You are paid through Khalti as soon as the customer confirms, and the platform never takes the booking out of your hands — you accept or reject every request yourself.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:40px\">\n<sc-for list=\"{{ providerPerks }}\" as=\"pk\" hint-placeholder-count=\"4\">\n<div style=\"background:var(--surface);padding:24px\"><div class=\"mn\" style=\"font-size:11px;color:var(--green);margin-bottom:12px\">{{ pk.n }}<\u002Fdiv><div style=\"font-size:16px;font-weight:600;margin-bottom:6px\">{{ pk.t }}<\u002Fdiv><div style=\"font-size:13.5px;color:var(--ink-2);line-height:1.55\">{{ pk.b }}<\u002Fdiv><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"background:var(--surface);border:1px solid var(--line);padding:30px;display:flex;align-items:center;gap:30px;justify-content:space-between\">\n<div><div style=\"font-size:20px;font-weight:600;margin-bottom:6px\">Ready to be listed?<\u002Fdiv><div style=\"font-size:14px;color:var(--ink-2)\">Sign up, mark your shop on the map, and an administrator reviews it the same day.<\u002Fdiv><\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ nav.signupProv }}\" class=\"pri\" style=\"flex:none\">Create a provider account<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ p.contact }}\">\n<section style=\"max-width:1000px;margin:0 auto;padding:56px 56px 88px\">\n<h1 style=\"font-size:42px;letter-spacing:-.03em;margin:0 0 12px\">Contact us<\u002Fh1>\n<p style=\"font-size:16px;color:var(--ink-2);margin:0 0 40px;max-width:38em\">Problems with a booking, a provider or a payment. We answer within one working day.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:48px;align-items:start\">\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<div><label class=\"lbl\" for=\"c1\">Your name<\u002Flabel><input class=\"inp\" id=\"c1\" value=\"Aarati Thapa\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"c2\">Email address<\u002Flabel><input class=\"inp\" id=\"c2\" value=\"aarati@example.com\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"c3\">What is this about?<\u002Flabel><sc-raw-select class=\"inp\" id=\"c3\"><option>A booking I made<\u002Foption><option>A payment or refund<\u002Foption><option>Reporting a provider<\u002Foption><option>My provider account<\u002Foption><option>Something else<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n<div><label class=\"lbl\" for=\"c4\">Message<\u002Flabel><textarea class=\"inp\" id=\"c4\" style=\"min-height:150px;resize:vertical\"><\u002Ftextarea><\u002Fdiv>\n<div><button type=\"button\" sc-camel-on-click=\"{{ sendContact }}\" class=\"pri\">Send message<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border:1px solid var(--line);background:var(--surface);padding:22px\">\n<div class=\"eyebrow\" style=\"margin-bottom:14px\">Other ways<\u002Fdiv>\n<div style=\"font-size:14px;line-height:1.7;color:var(--ink-2)\"><div style=\"font-weight:600;color:var(--ink)\">Phone<\u002Fdiv><div class=\"mn\">01-4567890<\u002Fdiv><div style=\"font-weight:600;color:var(--ink);margin-top:14px\">Office<\u002Fdiv><div class=\"dv\">Naxal, नक्साल, Kathmandu-1<br>Sun–Fri, 10:00–17:00<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ p.login }}\">\n<section style=\"display:grid;grid-template-columns:minmax(0,1fr) 460px;min-height:calc(100vh - 76px)\">\n<div style=\"display:flex;align-items:center;justify-content:flex-end;padding:64px 64px 64px 56px\">\n<div style=\"width:100%;max-width:420px\">\n<h1 style=\"font-size:38px;letter-spacing:-.03em;margin:0 0 8px\">Log in<\u002Fh1>\n<p style=\"font-size:14.5px;color:var(--ink-2);margin:0 0 30px\">Your bookings and favourites are where you left them.<\u002Fp>\n<sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border-left:3px solid var(--red);background:var(--red-bg);padding:13px 15px;margin-bottom:22px;font-size:13.5px;color:var(--red);line-height:1.5\">That email and password do not match an account. Check both, or reset your password.<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n<div><label class=\"lbl\" for=\"l1\">Email address<\u002Flabel><input class=\"inp\" id=\"l1\" type=\"email\" value=\"aarati@example.com\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"l2\">Password<\u002Flabel><input class=\"inp\" id=\"l2\" type=\"password\" value=\"Demo@1234\"><\u002Fdiv>\n<div style=\"display:flex;align-items:center;justify-content:space-between\"><label style=\"display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-2);cursor:pointer\"><input type=\"checkbox\" style=\"width:17px;height:17px;accent-color:#0b5c3f\">Keep me logged in<\u002Flabel><a href=\"#\" style=\"font-size:13.5px\">Forgot password?<\u002Fa><\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ doLogin }}\" class=\"pri\" style=\"width:100%\">Log in<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"margin-top:28px;padding-top:22px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px\">\n<div style=\"font-size:14px\">No account yet? <a href=\"#\" sc-camel-on-click=\"{{ nav.signup }}\">Create one<\u002Fa><\u002Fdiv>\n<div style=\"display:flex;gap:18px\"><a href=\"#\" sc-camel-on-click=\"{{ nav.adminlogin }}\" style=\"font-size:12.5px;color:var(--ink-3)\">Administrator entrance →<\u002Fa><button type=\"button\" sc-camel-on-click=\"{{ failLogin }}\" style=\"background:none;border:0;padding:0;cursor:pointer;font-size:12.5px;color:var(--ink-3);text-decoration:underline\">Preview the error state<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:var(--surface);border-left:1px solid var(--line);padding:64px 48px;display:flex;flex-direction:column;justify-content:center\">\n<div class=\"eyebrow\" style=\"margin-bottom:18px\">Demo accounts<\u002Fdiv>\n<sc-for list=\"{{ demoAccounts }}\" as=\"d\" hint-placeholder-count=\"3\">\n<button type=\"button\" sc-camel-on-click=\"{{ d.open }}\" style=\"display:flex;align-items:center;gap:16px;padding:16px 0;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;text-align:left;color:inherit;width:100%\" style-hover=\"background:var(--green-l)\">\n<span style=\"width:70px;flex:none\" class=\"eyebrow\">{{ d.role }}<\u002Fspan>\n<span class=\"mn\" style=\"flex:1;font-size:13px\">{{ d.email }}<\u002Fspan>\n<span style=\"font-size:13px;font-weight:600;color:var(--green)\">Open →<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<div style=\"font-size:12.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:16px;margin-top:2px\">Password for all three: <span class=\"mn\">Demo@1234<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ p.adminlogin }}\">\n<section style=\"min-height:calc(100vh - 76px);display:grid;place-items:center;background:#0c1a15;padding:64px 56px\">\n<div style=\"width:min(460px,100%);background:var(--paper);padding:40px 40px 34px;border-top:3px solid var(--lime)\">\n<div class=\"eyebrow\" style=\"color:var(--green);margin-bottom:16px\">Staff entrance<\u002Fdiv>\n<h1 style=\"font-size:30px;letter-spacing:-.025em;margin:0 0 10px\">Administrators only<\u002Fh1>\n<p style=\"font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:0 0 28px\">Customer and provider accounts are rejected here even with the correct password, and every attempt is logged.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n<div><label class=\"lbl\" for=\"a1\">Work email address<\u002Flabel><input class=\"inp\" id=\"a1\" value=\"admin@serviceexpert.local\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"a2\">Password<\u002Flabel><input class=\"inp\" id=\"a2\" type=\"password\" value=\"Demo@1234\"><\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ doAdminLogin }}\" class=\"pri\" style=\"width:100%\">Log in as administrator<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"margin-top:24px;padding-top:18px;border-top:1px solid var(--line);font-size:13px\"><a href=\"#\" sc-camel-on-click=\"{{ nav.login }}\">← Back to the normal login<\u002Fa><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ p.signup }}\">\n<section style=\"max-width:1080px;margin:0 auto;padding:52px 56px 88px\">\n<h1 style=\"font-size:42px;letter-spacing:-.03em;margin:0 0 10px\">Create your account<\u002Fh1>\n<p style=\"font-size:16px;color:var(--ink-2);margin:0 0 36px\">Two minutes. Providers answer three extra questions so customers know what they are booking.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:36px\">\n<button type=\"button\" sc-camel-on-click=\"{{ pickCust }}\" style=\"{{ roleCust }}\">\n<span style=\"display:flex;align-items:center;gap:11px;margin-bottom:9px\"><span style=\"{{ dotCust }}\"><\u002Fspan><span style=\"font-size:17px;font-weight:700\">I need a service<\u002Fspan><\u002Fspan>\n<span style=\"display:block;font-size:13.5px;color:var(--ink-2);line-height:1.55;padding-left:27px\">Search providers near you, book a job, pay with Khalti, leave a review.<\u002Fspan>\n<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ pickProv }}\" style=\"{{ roleProv }}\">\n<span style=\"display:flex;align-items:center;gap:11px;margin-bottom:9px\"><span style=\"{{ dotProv }}\"><\u002Fspan><span style=\"font-size:17px;font-weight:700\">I offer a service<\u002Fspan><\u002Fspan>\n<span style=\"display:block;font-size:13.5px;color:var(--ink-2);line-height:1.55;padding-left:27px\">List your trade, set your rate and hours, answer requests from a dashboard.<\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<h2 style=\"font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:0 0 20px\">Your details<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px 32px;padding-bottom:34px;border-bottom:1px solid var(--line)\">\n<div><label class=\"lbl\" for=\"n1\">Full name<\u002Flabel><input class=\"inp\" id=\"n1\" value=\"Aarati Thapa\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"n2\">Email address<\u002Flabel><input class=\"inp\" id=\"n2\" value=\"aarati@example.com\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"n3\">Mobile number<\u002Flabel><input class=\"inp mn\" id=\"n3\" value=\"9841000101\"><div style=\"font-size:12px;color:var(--ink-3);margin-top:6px\">Ten digits starting with 9 — providers call this number<\u002Fdiv><\u002Fdiv>\n<div><label class=\"lbl\" for=\"n4\">Password<\u002Flabel><input class=\"inp\" id=\"n4\" type=\"password\" value=\"Demo@1234\"><div style=\"font-size:12px;color:var(--ink-3);margin-top:6px\">Eight characters or more, with at least one number<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<sc-if value=\"{{ signupProvider }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:34px 0;border-bottom:1px solid var(--line)\">\n<h2 style=\"font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px\">Your service<\u002Fh2>\n<p style=\"font-size:13.5px;color:var(--ink-2);margin:0 0 22px\">Customers see all of this. Your rate and experience feed the recommendation score.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px 32px\">\n<div><label class=\"lbl\" for=\"n5\">Trade<\u002Flabel><sc-raw-select class=\"inp\" id=\"n5\"><option>Electrician<\u002Foption><option>Plumber<\u002Foption><option>Carpenter<\u002Foption><option>Cleaner<\u002Foption><option>Tutor<\u002Foption><option>Gardener<\u002Foption><option>Painter<\u002Foption><option>AC Repair<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n<div><label class=\"lbl\" for=\"n6\">Business name<\u002Flabel><input class=\"inp\" id=\"n6\" placeholder=\"Shrestha Electric Works\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"n7\">Hourly rate (Rs)<\u002Flabel><input class=\"inp mn\" id=\"n7\" placeholder=\"700\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"n8\">Years of experience<\u002Flabel><input class=\"inp mn\" id=\"n8\" placeholder=\"9\"><\u002Fdiv>\n<div style=\"grid-column:1/-1\"><label class=\"lbl\" for=\"n9\">About your work<\u002Flabel><textarea class=\"inp\" id=\"n9\" style=\"min-height:96px;resize:vertical\" placeholder=\"What you do, what you bring, how quickly you can usually come out.\"><\u002Ftextarea><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:28px;border:1px solid var(--line);background:var(--surface)\">\n<div style=\"display:flex;align-items:center;gap:10px;padding:13px 18px;background:var(--green);color:#fff\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"2.6\"><\u002Fcircle><\u002Fsvg><span style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700\">Required — mark your shop on the map<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 320px\">\n<div style=\"position:relative;min-height:260px;background:#e9ece8\">\n<svg width=\"100%\" height=\"100%\" sc-camel-view-box=\"0 0 620 260\" sc-camel-preserve-aspect-ratio=\"none\" aria-hidden=\"true\" style=\"position:absolute;inset:0\"><g stroke=\"#d3d8d2\" stroke-width=\"1\"><path d=\"M0 52H620M0 104H620M0 156H620M0 208H620M100 0V260M210 0V260M330 0V260M450 0V260M550 0V260\"><\u002Fpath><\u002Fg><g stroke=\"#bdc4bd\" stroke-width=\"4\" fill=\"none\"><path d=\"M0 156H620M330 0V260\"><\u002Fpath><\u002Fg><\u002Fsvg>\n<div style=\"position:absolute;left:330px;top:156px;transform:translate(-50%,-100%)\"><svg width=\"26\" height=\"34\" sc-camel-view-box=\"0 0 26 34\" aria-label=\"Shop pin\"><path d=\"M13 33S24 20.5 24 13A11 11 0 1 0 2 13c0 7.5 11 20 11 20Z\" fill=\"#0b5c3f\"><\u002Fpath><circle cx=\"13\" cy=\"13\" r=\"4\" fill=\"#fff\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n<div class=\"eyebrow\" style=\"position:absolute;left:14px;bottom:12px;background:rgba(247,247,244,.94);padding:4px 8px\">Galli Maps · click to place your pin<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-left:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px\">\n<div><label class=\"lbl\" for=\"n10\">Shop address<\u002Flabel><textarea class=\"inp dv\" id=\"n10\" style=\"min-height:74px;resize:vertical\">Chabahil, चाबहिल, Kathmandu-7<\u002Ftextarea><\u002Fdiv>\n<div class=\"mn\" style=\"font-size:12px;color:var(--ink-3)\">27.71825, 85.34561<\u002Fdiv>\n<div style=\"font-size:12.5px;color:var(--green-d);background:var(--green-l);padding:11px 13px;line-height:1.5\">Inside the valley boundary. Customers see the distance from this point to their job.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div style=\"padding-top:30px;display:flex;align-items:center;gap:22px\">\n<button type=\"button\" sc-camel-on-click=\"{{ doSignup }}\" class=\"pri\" style=\"min-height:54px;font-size:16px\">Create account<\u002Fbutton>\n<a href=\"#\" sc-camel-on-click=\"{{ nav.login }}\" style=\"font-size:14px\">I already have an account<\u002Fa>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ p.signupdone }}\">\n<section style=\"max-width:760px;margin:0 auto;padding:80px 56px 96px\">\n<div style=\"width:52px;height:52px;background:var(--amber-bg);display:grid;place-items:center;margin-bottom:26px\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#8a5a00\" stroke-width=\"1.8\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3.5 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h1 style=\"font-size:40px;letter-spacing:-.03em;margin:0 0 14px;line-height:1.1\">Your account is made. An administrator is checking your shop.<\u002Fh1>\n<p style=\"font-size:16.5px;color:var(--ink-2);line-height:1.6;margin:0 0 34px\">We verify the location and the trade of every provider before customers can find them — usually within a few hours on a working day. You can fill in your profile and working hours in the meantime.<\u002Fp>\n<div style=\"border:1px solid var(--line);background:var(--surface);margin-bottom:34px\">\n<sc-for list=\"{{ approvalSteps }}\" as=\"a\" hint-placeholder-count=\"4\">\n<div style=\"display:flex;gap:16px;align-items:flex-start;padding:18px 22px;border-bottom:1px solid var(--line)\">\n<span style=\"{{ a.dot }}\"><\u002Fspan>\n<span><span style=\"display:block;font-size:15px;font-weight:600;margin-bottom:3px\">{{ a.t }}<\u002Fspan><span style=\"display:block;font-size:13.5px;color:var(--ink-2);line-height:1.5\">{{ a.b }}<\u002Fspan><\u002Fspan>\n<span class=\"mn\" style=\"margin-left:auto;font-size:12px;color:var(--ink-3);flex:none\">{{ a.when }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;gap:14px\"><button type=\"button\" sc-camel-on-click=\"{{ nav.pprofile }}\" class=\"pri\">Fill in my profile<\u002Fbutton><button type=\"button\" sc-camel-on-click=\"{{ nav.phours }}\" class=\"sec\">Set my working hours<\u002Fbutton><\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ p.w1 }}\">\n<section style=\"max-width:1000px;margin:0 auto;padding:56px 56px 96px\">\n<div class=\"eyebrow\" style=\"margin-bottom:12px\">Step 1 of 5<\u002Fdiv>\n<h1 style=\"font-size:42px;letter-spacing:-.03em;margin:0 0 10px;line-height:1.08\">What do you need done?<\u002Fh1>\n<p style=\"font-size:16px;color:var(--ink-2);margin:0 0 34px\">Choose the trade. You can narrow it to the exact job next.<\u002Fp>\n<div style=\"display:flex;align-items:stretch;border:1px solid var(--line-2);background:var(--surface);max-width:520px;margin-bottom:26px\">\n<span style=\"display:grid;place-items:center;padding:0 14px;color:var(--ink-3)\"><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-4.3-4.3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<input class=\"inp\" placeholder=\"Or type what is wrong — “tap leaking”\" style=\"border:0\">\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)\">\n<sc-for list=\"{{ w1Cards }}\" as=\"c\" hint-placeholder-count=\"8\">\n<button type=\"button\" sc-camel-on-click=\"{{ c.open }}\" style=\"{{ c.style }}\" style-hover=\"background:var(--green-l)\">\n<svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{ c.stroke }}\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ c.icon }}\"><\u002Fpath><\u002Fsvg>\n<span style=\"margin-top:auto\"><span style=\"display:block;font-size:16.5px;font-weight:600;letter-spacing:-.01em\">{{ c.name }}<\u002Fspan><span class=\"mn\" style=\"display:block;font-size:11.5px;color:var(--ink-3);margin-top:4px\">{{ c.n }} near you<\u002Fspan><\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:30px;font-size:13.5px;color:var(--ink-3)\">Not sure which trade? <a href=\"#\" sc-camel-on-click=\"{{ nav.contact }}\">Describe the problem and we will point you<\u002Fa>.<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ p.w1b }}\">\n<section style=\"max-width:1180px;margin:0 auto;padding:48px 56px 96px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;align-items:start\">\n<div>\n<a href=\"#\" sc-camel-on-click=\"{{ nav.w1 }}\" style=\"font-size:13px;text-decoration:none;display:inline-block;margin-bottom:18px\">← Change the trade<\u002Fa>\n<div class=\"eyebrow\" style=\"margin-bottom:12px\">Step 1 of 5 · {{ svcName }}<\u002Fdiv>\n<h1 style=\"font-size:40px;letter-spacing:-.03em;margin:0 0 10px;line-height:1.08\">Which job is it?<\u002Fh1>\n<p style=\"font-size:16px;color:var(--ink-2);margin:0 0 30px;max-width:38em\">This sets a realistic duration, which is what the cost estimate is built from. You can change it later.<\u002Fp>\n<div style=\"border:1px solid var(--line);backgroun in<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-if>\n<div class=\"eyebrow\" style=\"position:absolute;left:20px;bottom:18px;background:rgba(247,247,244,.94);padding:5px 10px\">Galli Maps · Kathmandu valley<\u002Fdiv>\n<div style=\"position:absolute;right:20px;top:20px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line)\">\n<button type=\"button\" aria-label=\"Zoom in\" style=\"width:40px;height:40px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer;font-size:17px\">+<\u002Fbutton>\n<button type=\"button\" aria-label=\"Zoom out\" style=\"width:40px;height:40px;background:none;border:0;cursor:pointer;font-size:17px\">−<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border-left:1px solid var(--line);background:var(--surface);padding:44px 40px;display:flex;flex-direction:column\">\n<a href=\"#\" sc-camel-on-click=\"{{ nav.w1b }}\" style=\"font-size:13px;text-decoration:none;margin-bottom:18px\">← Back to the job<\u002Fa>\n<div class=\"eyebrow\" style=\"margin-bottom:12px\">Step 2 of 5<\u002Fdiv>\n<h1 style=\"font-size:32px;letter-spacing:-.025em;margin:0 0 10px;line-height:1.12\">Where is the job?<\u002Fh1>\n<p style=\"font-size:14.5px;color:var(--ink-2);line-height:1.6;margin:0 0 26px\">Drop a pin on the exact building. Providers are ranked by road distance to this point, so a rough pin gives you a rough ranking.<\u002Fp>\n<div style=\"display:flex;align-items:stretch;border:1px solid var(--line-2);margin-bottom:14px\">\n<span style=\"display:grid;place-items:center;padding:0 13px;color:var(--ink-3)\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-4.3-4.3\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n<input class=\"inp\" placeholder=\"Search a place — Baluwatar, Patan Dhoka…\" style=\"border:0\">\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ setLoc }}\" class=\"sec\" style=\"width:100%;margin-bottom:26px;min-height:46px;font-size:14px\">Use my current location<\u002Fbutton>\n<sc-if value=\"{{ locSet }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border:1px solid var(--green-m);background:var(--green-l);padding:18px;margin-bottom:22px\">\n<div class=\"eyebrow\" style=\"color:var(--green);margin-bottom:10px\">Pin placed<\u002Fdiv>\n<div class=\"dv\" style=\"font-size:16px;font-weight:600;line-height:1.4;margin-bottom:6px\">Baluwatar, बालुवाटार, Kathmandu-4<\u002Fdiv>\n<div class=\"mn\" style=\"font-size:12px;color:var(--green-d)\">27.73412, 85.33079<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-bottom:22px\"><label class=\"lbl\" for=\"w2a\">Correct the address if you need to<\u002Flabel><textarea class=\"inp dv\" id=\"w2a\" style=\"min-height:80px;resize:vertical\">Baluwatar, बालुवाटार, Kathmandu-4<\u002Ftextarea><\u002Fdiv>\n<div style=\"margin-bottom:auto\"><label class=\"lbl\" for=\"w2b\">Landmark for the provider (optional)<\u002Flabel><input class=\"inp\" id=\"w2b\" placeholder=\"Green gate opposite the pharmacy\"><\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ nav.w3 }}\" class=\"pri\" style=\"width:100%;margin-top:26px\">Continue to date and time<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ noLoc }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"border:1px dashed var(--line-2);padding:26px;text-align:center;color:var(--ink-3);font-size:14px;line-height:1.6;margin-bottom:auto\">No pin yet.<br>Click the map or use your current location.<\u002Fdiv>\n<button type=\"button\" disabled=\"true\" style=\"width:100%;margin-top:26px;min-height:50px;background:var(--sunk);color:var(--ink-4);border:0;font-size:15px;font-weight:700;cursor:not-allowed\">Continue to date and time<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ p.w3 }}\">\n<section style=\"max-width:1180px;margin:0 auto;padding:48px 56px 96px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:56px;align-items:start\">\n<div>\n<a href=\"#\" sc-camel-on-click=\"{{ nav.w2 }}\" style=\"font-size:13px;text-decoration:none;display:inline-block;margin-bottom:18px\">← Back to location<\u002Fa>\n<div class=\"eyebrow\" style=\"margin-bottom:12px\">Step 3 of 5<\u002Fdiv>\n<h1 style=\"font-size:40px;letter-spacing:-.03em;margin:0 0 10px;line-height:1.08\">When suits you?<\u002Fh1>\n<p style=\"font-size:16px;color:var(--ink-2);margin:0 0 30px;max-width:38em\">Providers whose working hours do not cover this slot are filtered out of your results — you will not waste a request on someone who is closed.<\u002Fp>\n\n<div class=\"eyebrow\" style=\"margin-bottom:12px\">Pick a day<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:30px\">\n<sc-for list=\"{{ days }}\" as=\"d\" hint-placeholder-count=\"7\">\n<button type=\"button\" sc-camel-on-click=\"{{ d.open }}\" style=\"{{ d.style }}\">\n<span style=\"font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.7\">{{ d.dow }}<\u002Fspan>\n<span class=\"mn\" style=\"font-size:22px;margin-top:4px\">{{ d.num }}<\u002Fspan>\n<span style=\"font-size:11px;margin-top:4px;opacity:.75\">{{ d.note }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div class=\"eyebrow\" style=\"margin-bottom:12px\">Pick a start time<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:12px\">\n<sc-for list=\"{{ slots }}\" as=\"t\" hint-placeholder-count=\"12\">\n<button type=\"button\" sc-camel-on-click=\"{{ t.open }}\" style=\"{{ t.style }}\" title=\"{{ t.title }}\"><span class=\"mn\" style=\"font-size:14px\">{{ t.label }}<\u002Fspan><span style=\"font-size:10.5px;margin-top:3px;opacity:.8\">{{ t.note }}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display:flex;gap:22px;font-size:1 play:block;font-size:14px;line-height:1.45\">{{ sm.v }}<\u002Fspan><\u002Fspan>\n<button type=\"button\" sc-camel-on-click=\"{{ sm.edit }}\" style=\"background:none;border:0;padding:0;cursor:pointer;font-size:12.5px;color:var(--green);font-weight:600;flex:none\">Edit<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ p.w4 }}\">\n<section style=\"max-width:1180px;margin:0 auto;padding:48px 56px 96px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:56px;align-items:start\">\n<div>\n<a href=\"#\" sc-camel-on-click=\"{{ nav.w3 }}\" style=\"font-size:13px;text-decoration:none;display:inline-block;margin-bottom:18px\">← Back to date and time<\u002Fa>\n<div class=\"eyebrow\" style=\"margin-bottom:12px\">Step 4 of 5<\u002Fdiv>\n<h1 style=\"font-size:40px;letter-spacing:-.03em;margin:0 0 10px;line-height:1.08\">What matters most to you?<\u002Fh1>\n<p style=\"font-size:16px;color:var(--ink-2);margin:0 0 30px;max-width:40em\">This sets how much each factor counts towards the score. You can change it on the results page and watch the list re-rank.<\u002Fp>\n<div style=\"border:1px solid var(--line);background:var(--surface);margin-bottom:30px\">\n<sc-for list=\"{{ modeOptions }}\" as=\"m\" hint-placeholder-count=\"5\">\n<button type=\"button\" sc-camel-on-click=\"{{ m.open }}\" style=\"{{ m.style }}\" style-hover=\"background:var(--green-l)\">\n<span style=\"{{ m.dot }}\"><\u002Fspan>\n<span style=\"flex:1;min-width:0\"><span style=\"display:block;font-size:16px;font-weight:600;margin-bottom:3px\">{{ m.label }}<\u002Fspan><span style=\"display:block;font-size:13px;color:var(--ink-2);line-height:1.5\">{{ m.sub }}<\u002Fspan><\u002Fspan>\n<span style=\"display:flex;gap:3px;align-items:flex-end;height:38px;flex:none\">\n<sc-for list=\"{{ m.bars }}\" as=\"b\" hint-placeholder-count=\"4\"><span style=\"{{ b }}\"><\u002Fspan><\u002Fsc-for>\n<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"max-w u002Fdiv>\n<div style=\"padding-left:36px\"><div class=\"mn\" style=\"font-size:22px\">{{ prov.exp }}<\u002Fdiv><div class=\"eyebrow\">in the trade<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border:1px solid var(--line);padding:22px;background:var(--paper)\">\n<div class=\"mn\" style=\"font-size:32px;font-weight:500\">Rs {{ prov.rate }}<\u002Fdiv>\n<div class=\"eyebrow\" style=\"margin-bottom:16px\">per hour<\u002Fdiv>\n<div style=\"font-size:13px;color:var(--ink-2);line-height:1.6;border-top:1px solid var(--line);padding-top:14px;margin-bottom:16px\">Your {{ durationShort }} job works out at about <span class=\"mn\" style=\"color:var(--ink);font-weight:500\">{{ prov.estimate }}<\u002Fspan>, confirmed before you pay.<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ bookProv }}\" class=\"pri\" style=\"width:100%;margin-bottom:10px\">Book this provider<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ toggleFav }}\" class=\"sec\" style=\"width:100%;min-height:46px;font-size:14px\">{{ favLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:0;border-top:1px solid var(--line)\">\n<sc-for list=\"{{ profileTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{ t.open }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width:1320px;margin:0 auto;padding:36px 56px 90px\">\n<sc-if value=\"{{ tabOverview }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:48px;align-items:start\">\n<div>\n<h2 style=\"font-size:15px;font-weight:700;margin:0 0 16px\">Score for your request<\u002Fh2>\n<div style=\"border:1px solid var(--line);background:var(--surface)\">\n<sc-for list=\"{{ prov.factors }}\" as=\"f\" hint-placeholder-count=\"4\">\n<div style=\"display:grid;grid-template-columns:120px minmax(0,1fr) 70px;gap:18px;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line)\">\n<span style=\"font-size:14px;font-weight:600\">{{ f.label }}<\u002Fspan>\n<span><span style=\"display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:6px\">{{ f.detail }}<\u002Fspan><span style=\"display:block;height:6px;background:var(--sunk)\"><span style=\"{{ f.bar }}\"><\u002Fspan><\u002Fspan><\u002Fspan>\n<span class=\"mn\" style=\"text-align:right;font-size:14px\">{{ f.pts }} pts<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"display:flex;justify-content:space-between;padding:16px 20px;background:var(--green-l)\"><span style=\"font-size:14px;font-weight:700;color:var(--green-d)\">Total<\u002Fspan><span class=\"mn\" style=\"font-size:17px;color:var(--green-d)\">{{ prov.score }} / 100<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<h2 style=\"font-size:15px;font-weight:700;margin:34px 0 16px\">What they cover<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)\">\n<sc-for list=\"{{ prov.skills }}\" as=\"sk\" hint-placeholder-count=\"6\">\n<div style=\"background:var(--surface);padding:14px 18px;font-size:14px\">{{ sk }}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:18px\">\n<div style=\"border:1px solid var(--line);background:var(--surface)\">\n<div style=\"padding:14px 18px;border-bottom:1px solid var(--line)\"><span class=\"eyebrow\">Working hours<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{ hoursRows }}\" as=\"h\" hint-placeholder-count=\"7\">\n<div style=\"{{ h.style }}\"><span>{{ h.day }}<\u002Fspan><span class=\"mn\">{{ h.text }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"border:1px solid var(--line);background:var(--surface);padding:18px\">\n<div class=\"eyebrow\" style=\"margin-bottom:10px\">Distance from you<\u002Fdiv>\n<div class=\"mn\" style=\"font-size:24px\">{{ prov.km }}<\u002Fdiv>\n<div style=\"font-size:13px;color:var(--ink-2);margin-bottom:14px\">about {{ prov.mins }} by road<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{ nav.route }}\" class=\"gho\">See the junction-by-junction route →<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ tabReviews }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"display:grid;grid-template-columns:280px minmax(0,1fr);gap:48px;align-items:start\">\n<div style=\"border:1px solid var(--line);background:var(--surface);padding:22px\">\n<div class=\"mn\" style=\"font-size:44px;font-weight:500;line-height:1\">{{ prov.ratingStr }}<\u002Fdiv>\n<div style=\"font-size:13px;color:var(--ink-2);margin-bottom:18px\">{{ prov.reviewsLine }}<\u002Fdiv>\n<sc-for list=\"{{ ratingBars }}\" as=\"rb\" hint-placeholder-count=\"5\">\n<div style=\"display:flex;align-items:center;gap:10px;padding:4px 0\"><span class=\"mn\" style=\"font-size:12px;width:12px\">{{ rb.n }}<\u002Fspan><span style=\"flex:1;height:6px;background:var(--sunk)\"><span style=\"{{ rb.bar }}\"><\u002Fspan><\u002Fspan><span class=\"mn\" style=\"font-size:11.5px;color:var(--ink-3);width:22px;text-align:right\">{{ rb.c }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"border-top:1px solid var(--line)\">\n<sc-for list=\"{{ reviews }}\" as=\"v\" hint-placeholder-count=\"5\">\n<div style=\"padding:20px 0;border-bottom:1px solid var(--line)\">\n<div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:7px\"><span style=\"font-size:14px;color:var(--green);letter-spacing:.1em\">{{ v.stars }}<\u002Fspan><span style=\"font-size:14px;font-weight:600\">{{ v.who }}<\u002Fspan><span style=\"font-size:12.5px;color:var(--ink-3)\">{{ v.job }}<\u002Fspan><span class=\"mn\" style=\"font-size:12px;color:var(--ink-3);margin-left:auto\">{{ v.when }}<\u002Fspan><\u002Fdiv>\n<div style=\"font-size:14.5px;line-height:1.6;color:var(--ink-2);max-width:52em\">{{ v.text }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ tabHours }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"max-width:640px\">\n<h2 style=\"font-size:15px;font-weight:700;margin:0 0 16px\">When {{ prov.owner }} works<\u002Fh2>\n<div style=\"border:1px solid var(--line);background:var(--surface)\">\n<sc-for list=\"{{ hoursRows }}\" as=\"h\" hint-placeholder-count=\"7\">\n<div style=\"{{ h.bigStyle }}\"><span style=\"font-size:15px\">{{ h.day }}<\u002Fspan><span class=\"mn\" style=\"font-size:14px\">{{ h.text }}<\u002Fspan><\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"font-size:13.5px;color:var(--ink-2);line-height:1.6;margin-top:18px\">A booking that would run past closing time is refused at the point you pick the time, not after you have waited for an answer.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ p.route }}\">\n<section style=\"max-width:1320px;margin:0 auto;padding:40px 56px 90px\">\n<a href=\"#\" sc-camel-on-click=\"{{ nav.profile }}\" style=\"font-size:13px;text-decoration:none;display:inline-block;margin-bottom:18px\">← Back to {{ prov.shop }}<\u002Fa>\n<h1 style=\"font-size:38px;letter-spacing:-.03em;margin:0 0 10px\">The route we measured<\u002Fh1>\n<p style=\"font-size:15.5px;color:var(--ink-2);margin:0 0 30px;max-width:46em\">Distance is the shortest driveable path from their shop to your pin — computed with Dijkstra over the valley road graph, not a straight line. A straight line would have said 1.73 km.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:36px;align-items:start\">\n<div style=\"border:1px solid var(--line);background:var(--surface)\">\n<div style=\"position:relative;height:460px;background:#e9ece8\">\n<svg width=\"100%\" height=\"100%\" sc-camel-view-box=\"0 0 760 460\" sc-camel-preserve-aspect-ratio=\"none\" aria-hidden=\"true\" style=\"position:absolute;inset:0\">\n<g stroke=\"#d6dad4\" stroke-width=\"1\"><path d=\"M0 60H760M0 120H760M0 180H760M0 240H760M0 300H760M0 360H760M0 420H760M80 0V460M160 0V460M240 0V460M320 0V460M400 0V460M480 0V460M560 0V460M640 0V460M720 0V460\"><\u002Fpath><\u002Fg>\n<g stroke=\"#c2c8c1\" stroke-width=\"5\" fill=\"none\"><path d=\"M0 240H760M400 0V460\"><\u002Fpath><\u002Fg>\n<path d=\"M120 380 L240 380 L240 240 L400 240 L400 120 L600 120 L600 74\" fill=\"none\" stroke=\"#0b5c3f\" stroke-width=\"5\"><\u002Fpath>\n<g fill=\"#0b5c3f\"><circle cx=\"240\" cy=\"380\" r=\"5\"><\u002Fcircle><circle cx=\"240\" cy=\"240\" r=\"5\"><\u002Fcircle><circle cx=\"400\" cy=\"240\" r=\"5\"><\u002Fcircle><circle cx=\"400\" cy=\"120\" r=\"5\"><\u002Fcircle><circle cx=\"600\" cy=\"120\" r=\"5\"><\u002Fcircle><\u002Fg>\n<\u002Fsvg>\n<div style=\"position:absolute;left:120px;top:380px;transform:translate(-50%,-100%)\"><svg width=\"28\" height=\"36\" sc-camel-view-box=\"0 0 26 34\" aria-label=\"Shop\"><path d=\"M13 33S24 20.5 24 13A11 11 0 1 0 2 13c0 7.5 11 20 11 20Z\" fill=\"#111d18\"><\u002Fpath><circle cx=\"13\" cy=\"13\" r=\"4\" fill=\"#fff\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n<div style=\"position:absolute;left:600px;top:74px;transform:translate(-50%,-100%)\"><svg width=\"28\" height=\"36\" sc-camel-view-box=\"0 0 26 34\" aria-label=\"Job\"><path d=\"M13 33S24 20.5 24 13A11 11 0 1 0 2 13c0 7.5 11 20 11 20Z\" fill=\"#0b5c3f\"><\u002Fpath><circle cx=\"13\" cy=\"13\" r=\"4\" fill=\"#fff\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n<div style=\"position:absolute;left:16px;bottom:14px;display:flex;gap:16px;background:rgba(247,247,244,.95);padding:7px 10px\" class=\"eyebrow\">\n<span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;background:#111d18\"><\u002Fspan>Shop<\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:10px;height:10px;background:#0b5c3f\"><\u002Fspan>Job<\u002Fspan>\n<span style=\"display:flex;align-items:center;gap:6px\"><span style=\"width:18px;height:4px;background:#0b5c3f\"><\u002Fspan>Chosen path<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;border-top:1px solid var(--line)\">\n<div style=\"padding:16px 20px;border-right:1px solid var(--line)\"><div class=\"mn\" style=\"font-size:21px\">2.41 km<\u002Fdiv><div class=\"eyebrow\">road distance<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:16px 20px;border-right:1px solid var(--line)\"><div class=\"mn\" style=\"font-size:21px\">9 min<\u002Fdiv><div class=\"eyebrow\">typical drive<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:16px 20px;border-right:1px solid var(--line)\"><div class=\"mn\" style=\"font-size:21px\">6<\u002Fdiv><div class=\"eyebrow\">junctions<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:16px 20px\"><div class=\"mn\" style=\"font-size:21px\">28<\u002Fdiv><div class=\"eyebrow\">nodes explored<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border:1px solid var(--line);background:var(--surface)\">\n<div style=\"padding:16px 20px;border-bottom:1px solid var(--line)\"><span class=\"eyebrow\">Step by step<\u002Fspan><\u002Fdiv>\n<sc-for list=\"{{ routeLegs }}\" as=\"l\" hint-placeholder-count=\"6\">\n<div style=\"display:flex;align-items:flex-start;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line)\">\n<span style=\"{{ l.dot }}\"><\u002Fspan>\n<span style=\"flex:1\"><span style=\"display:block;font-size:14px;font-weight:500\">{{ l.name }}<\u002Fspan><span style=\"display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px\">{{ l.via }}<\u002Fspan><\u002Fspan>\n<span style=\"text-align:right;flex:none\"><span class=\"mn\" style=\"display:block;font-size:13px\">{{ l.cum }}<\u002Fspan><span class=\"mn\" style=\"display:block;font-size:11px;color:var(--ink-3)\">{{ l.leg }}<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<div style=\"padding:16px 20px;font-size:12.5px;color:var(--ink-2);line-height:1.6\">Dijkstra settles each junction once, in order of distance from the shop, and stops as soon as your pin is settled — so the path above is provably the shortest available.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ p.bdetails }}\">\n<section style=\"max-width:1180px;margin:0 auto;padding:44px 56px 90px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:56px;align-items:start\">\n<div>\n<a href=\"#\" sc-camel-on-click=\"{{ nav.w5 }}\" style=\"font-size:13px;text-decoration:none;display:inline-block;margin-bottom:18px\">← Back to the ranked list<\u002Fa>\n<div class=\"eyebrow\" style=\"margin-bottom:12px\">Booking · 1 of 3<\u002Fdiv>\n<h1 style=\"font-size:38px;letter-spacing:-.03em;margin:0 0 10px;line-height:1.1\">Tell {{ prov.owner }} about the job<\u002Fh1>\n<p style=\"font-size:15.5px;color:var(--ink-2);margin:0 0 30px;max-width:40em\">The clearer this is, the more likely they accept first time and arrive with the right parts.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div><label class=\"lbl\" for=\"bd1\">What needs doing?<\u002Flabel><textarea class=\"inp\" id=\"bd1\" style=\"min-height:120px;resize:vertical\">Two kitchen sockets keep tripping the main breaker when the microwave and kettle run together. The flat is on the second floor.<\u002Ftextarea><div style=\"font-size:12.5px;color:var(--ink-3);margin-top:7px\">Mention the floor, the age of the wiring, and anything they will need to bring.<\u002Fdiv><\u002Fdiv>\n<div><label class=\"lbl\">Photos (optional)<\u002Flabel>\n<div style=\"display:flex;gap:12px\">\n<div style=\"width:110px;height:90px;border:1px dashed var(--line-2);display:grid;place-items:center;background:var(--surface);color:var(--ink-3);font-size:12px;text-align:center;line-height:1.4\">Drop a<br>photo<\u002Fdiv>\n<div style=\"width:110px;height:90px;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;color:var(--ink-4);font-size:11px\">socket-1.jpg<\u002Fdiv>\n<div style=\"width:110px;height:90px;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;color:var(--ink-4);font-size:11px\">breaker.jpg<\u002Fdiv>\n<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px\">\n<div><label class=\"lbl\" for=\"bd2\">Contact number for this job<\u002Flabel><input class=\"inp mn\" id=\"bd2\" value=\"9841000101\"><\u002Fdiv>\n<div><label class=\"lbl\" for=\"bd3\">Who will be there?<\u002Flabel><sc-raw-select class=\"inp\" id=\"bd3\"><option>Me<\u002Foption><option>A family member<\u002Foption><option>The tenant<\u002Foption><option>Building caretaker<\u002Foption><\u002Fsc-raw-select><\u002Fdiv>\n<\u002Fdiv>\n<div><label class=\"lbl\" for=\"bd4\">Access notes (optional)<\u002Flabel><input class=\"inp\" id=\"bd4\" placeholder=\"Green gate opposite the pharmacy, ring the top bell\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:32px;display:flex;gap:16px;align-items:center\">\n<button type=\"button\" sc-camel-on-click=\"{{ nav.breview }}\" class=\"pri\" style=\"min-height:52px;font-size:15px\">Continue to review<\u002Fbutton>\n<span style=\"font-size:13px;color:var(--ink-3)\">Nothing is sent yet<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"border:1px solid var(--line);background:var(--surface);position:sticky;top:24px\">\n<div style=\"padding:18px 20px;border-bottom:1px solid var(--line)\"><div style=\"font-size:16px;font-weight:700\">{{ prov.shop }}<\u002Fdiv><div style=\"font-size:13px;color:var(--ink-2);margin-top:2px\">{{ prov.owner }} · {{ prov.ratingStr }} ★<\u002Fdiv><\u002Fdiv>\n<sc-for list=\"{{ summary }}\" as=\"sm\" hint-placeholder-count=\"4\">\n<div style=\"display:flex;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line)\"><span style=\"flex:1\"><span class=\"eyebrow\" style=\"display:block;margin-bottom:3px\">{{ sm.k }}<\u002Fspan><span class=\"dv\" style=\"display:block;font-size:13.5px;line-height:1.45\">{{ sm.v }}<\u002Fspan><\u002Fspan><button type=\"button\" sc-camel-on-click=\"{{ sm.edit }}\" style=\"background:none;border:0;padding:0;cursor:pointer;font-size:12.5px;color:var(--green);font-weigh
