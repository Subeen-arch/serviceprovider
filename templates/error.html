{% extends "base.html" %}
{% block title %}{{ code }} - Service Provider{% endblock %}
{% block container_class %}narrow{% endblock %}

{% block content %}
<div class="empty">
  <strong class="error-code">{{ code }}</strong>
  <p>{{ message }}</p>
  {% if detail %}
    <p class="error-detail">{{ detail }}</p>
  {% endif %}
  <a class="btn" href="{{ url_for('index') }}">Back to the start</a>
</div>
{% endblock %}
